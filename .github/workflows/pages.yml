name: Deploy package index

# The Pages site covers the pip index under pypi/ and per-repo docs (e.g.
# bluz/, synced from consumer repos' own docs CI). A branch-source Pages
# deployment rebuilds on every push to main, which meant a full deploy run for
# each unrelated actions/ commit. Path-filtered so it fires only when published
# content actually changes.
on:
    push:
        branches: [main]
        paths: ['pypi/**', 'bluz/**']
    workflow_dispatch:

concurrency:
    group: pages
    cancel-in-progress: true

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    deploy:
        runs-on: [self-hosted, light]
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: .
            - id: deployment
              uses: actions/deploy-pages@v4
